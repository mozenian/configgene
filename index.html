<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Drop Config Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .output-section {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #000;
            color: #10b981;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 4px;
            resize: vertical;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.success {
            background: var(--success);
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ Auto Drop Config Generator ⚡</h1>
        <p style="color: var(--text-muted);">Tinggal centang-centang, script langsung jadi tanpa error!</p>
    </header>

    <div class="grid">
        <!-- GENERAL SETTINGS -->
        <div class="card">
            <h2>Pengaturan Umum</h2>
            
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="BuySeeds" checked> Beli Seeds
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="BuyGears" checked> Beli Gears
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="DailyDeal" checked> Ambil Daily Deal
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="AutoSell" checked> Auto Sell
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="BuyPets"> Beli Pets (Auction)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="ForceSmallServer"> Auto Small Server
                </label>
            </div>

            <div class="form-group">
                <label>Delay Beli (Detik)</label>
                <input type="number" id="Delay" step="0.1" value="0.5">
            </div>
            
            <div class="form-group">
                <label>Max Bid Pets (Contoh: 50M)</label>
                <input type="text" id="MaxBid" value="50M">
            </div>
        </div>

        <!-- MAIL SETTINGS -->
        <div class="card">
            <h2>Pengaturan Mail (Kirim Barang)</h2>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="AutoMail"> Aktifkan Auto Mail
                </label>
            </div>
            <div class="form-group">
                <label>Target Username (Penerima Barang)</label>
                <input type="text" id="TargetUsername" value="bagussaputra889" placeholder="Masukkan username utama">
            </div>
            <div class="form-group">
                <label>Interval Kirim Mail (Jam)</label>
                <input type="number" id="MailIntervalHours" value="6">
            </div>
        </div>
    </div>

    <!-- PETS & CONFIG -->
    <div class="card">
        <h2>Target Pets (Auction)</h2>
        <div class="grid">
            <div class="form-group">
                <label>Ukuran Pet (SizePets)</label>
                <input type="text" id="SizePets" value="Any" placeholder="Any, Big, Giant, dll">
            </div>
            <div class="form-group">
                <label>Mutasi Pet (MutationPets)</label>
                <input type="text" id="MutationPets" value="Any" placeholder="Any, Golden, dll">
            </div>
        </div>
        <div class="checkbox-grid" id="petList">
            <!-- Diisi lewat JS -->
        </div>
    </div>

    <div class="grid">
        <!-- SEEDS -->
        <div class="card">
            <h2>Target Seeds</h2>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="SeedsAll" onchange="toggleAll('seedList', this.checked)"> <b>Pilih Semua / Batal Pilih</b>
                </label>
            </div>
            <div class="checkbox-grid" id="seedList">
                <!-- Diisi lewat JS -->
            </div>
        </div>

        <!-- GEARS -->
        <div class="card">
            <h2>Target Gears</h2>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="GearsAll" onchange="toggleAll('gearList', this.checked)"> <b>Pilih Semua / Batal Pilih</b>
                </label>
            </div>
            <div class="checkbox-grid" id="gearList">
                <!-- Diisi lewat JS -->
            </div>
        </div>
    </div>

    <div class="output-section">
        <h2>Hasil Kode Config (Copy-Paste ke Executor)</h2>
        <textarea id="outputCode" readonly></textarea>
        <button id="copyBtn" onclick="copyCode()">📋 Copy Script ke Clipboard</button>
    </div>
</div>

<script>
    // Data list
    const pets = ["Raccoon", "Firefly", "Robin", "Bunny", "Frog", "Owl", "Deer", "Unicorn", "Bee", "Bald Eagle", "Golden Dragonfly", "Turtle", "Monkey"];
    const seeds = ["Plum", "Sun Bloom", "Star Fruit", "Dragon's Breath", "Hypno Bloom", "Moon Bloom", "Pineapple", "Cinnamon Stick", "Conifer Cone", "Bamboo", "Carrot", "Tulip", "Mushroom", "Mango", "Acorn", "All"];
    const gears = ["Legendary Sprinkler", "Super Sprinkler", "Super Watering Can", "Trowel", "Rare Sprinkler", "Uncommon Sprinkler", "Common Sprinkler", "Basic Pot", "All"];

    // Generate Checkboxes
    function generateCheckboxes(containerId, items, defaultCheck = false) {
        const container = document.getElementById(containerId);
        items.forEach(item => {
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            const checkedAttr = defaultCheck ? 'checked' : '';
            label.innerHTML = `<input type="checkbox" value="${item}" ${checkedAttr}> ${item}`;
            container.appendChild(label);
        });
    }

    function toggleAll(containerId, isChecked) {
        const checkboxes = document.getElementById(containerId).querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = isChecked);
        generateCode();
    }

    generateCheckboxes('petList', pets, true);
    generateCheckboxes('seedList', seeds, true);
    generateCheckboxes('gearList', gears, true);

    // Get values from a checkbox container
    function getCheckedValues(containerId) {
        const checkboxes = document.getElementById(containerId).querySelectorAll('input[type="checkbox"]:checked');
        let result = "";
        checkboxes.forEach(cb => {
            // Kita escape tanda kutip agar Dragon's Breath aman
            result += `        ["${cb.value}"] = true,\n`;
        });
        return result;
    }

    // Generate the Lua Code
    function generateCode() {
        const BuySeeds = document.getElementById('BuySeeds').checked;
        const BuyGears = document.getElementById('BuyGears').checked;
        const DailyDeal = document.getElementById('DailyDeal').checked;
        const AutoSell = document.getElementById('AutoSell').checked;
        const AutoMail = document.getElementById('AutoMail').checked;
        const BuyPets = document.getElementById('BuyPets').checked;
        const ForceSmallServer = document.getElementById('ForceSmallServer').checked;
        
        const Delay = document.getElementById('Delay').value || "0.5";
        const TargetUsername = document.getElementById('TargetUsername').value;
        const MailIntervalHours = document.getElementById('MailIntervalHours').value || "6";
        const MaxBid = document.getElementById('MaxBid').value;
        const SizePets = document.getElementById('SizePets').value;
        const MutationPets = document.getElementById('MutationPets').value;

        const petsCode = getCheckedValues('petList');
        const seedsCode = getCheckedValues('seedList');
        const gearsCode = getCheckedValues('gearList');

        const code = \`getgenv().MuzeAutoBuyConfig = {
    BuySeeds = \${BuySeeds},
    BuyGears = \${BuyGears},
    DailyDeal = \${DailyDeal},
    AutoSell = \${AutoSell},
    Delay = \${Delay},
    AutoMail = \${AutoMail},
    TargetUsername = "\${TargetUsername}",
    MailIntervalHours = \${MailIntervalHours},
    BuyPets = \${BuyPets}, 
    MaxBid = "\${MaxBid}",
    ForceSmallServer = \${ForceSmallServer},

    Pets = {
\${petsCode}    },

    SizePets = "\${SizePets}",
    MutationPets = "\${MutationPets}",

    Seeds = {
\${seedsCode}    },

    Gears = {
\${gearsCode}    }
}

loadstring(game:HttpGet("https://raw.githubusercontent.com/azellsennse/mujeee/refs/heads/main/buyerkaitun.lua"))()\`;

        document.getElementById('outputCode').value = code;
    }

    // Copy to clipboard
    function copyCode() {
        const output = document.getElementById('outputCode');
        output.select();
        output.setSelectionRange(0, 99999); // For mobile devices
        navigator.clipboard.writeText(output.value).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✅ Berhasil Di-Copy!";
            btn.classList.add("success");
            setTimeout(() => {
                btn.innerText = "📋 Copy Script ke Clipboard";
                btn.classList.remove("success");
            }, 2000);
        });
    }

    // Add event listeners to all inputs to auto-update the code
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', generateCode);
        input.addEventListener('change', generateCode);
    });

    // Initial generate
    generateCode();
</script>

</body>
</html>
